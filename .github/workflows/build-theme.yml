name: Build Sakht Sar WordPress Theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create installable theme ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -d wp-content/themes/sakht-sar
          mkdir -p dist
          rm -f dist/sakht-sar-wordpress.zip
          cd wp-content/themes
          zip -r ../../../dist/sakht-sar-wordpress.zip sakht-sar \
            -x 'sakht-sar/.git/*' \
               'sakht-sar/node_modules/*' \
               'sakht-sar/.DS_Store'
          cd ../../..
          unzip -t dist/sakht-sar-wordpress.zip
          ls -lh dist/sakht-sar-wordpress.zip

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sakht-sar-wordpress
          path: dist/sakht-sar-wordpress.zip
          if-no-files-found: error
          retention-days: 30
