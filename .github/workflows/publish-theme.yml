name: Publish Installable Sakht Sar Theme

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate theme
        shell: bash
        run: |
          set -euo pipefail
          THEME_DIR="wp-content/themes/sakht-sar"
          test -f "$THEME_DIR/style.css"
          test -f "$THEME_DIR/index.php"
          grep -q "Theme Name:" "$THEME_DIR/style.css"

      - name: Build installable WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cd wp-content/themes
          zip -r "../../dist/sakht-sar-wordpress.zip" sakht-sar \
            -x 'sakht-sar/.git/*' \
               'sakht-sar/node_modules/*' \
               'sakht-sar/.DS_Store'
          cd ../..
          test -f dist/sakht-sar-wordpress.zip
          unzip -l dist/sakht-sar-wordpress.zip | grep -q 'sakht-sar/style.css'
          unzip -l dist/sakht-sar-wordpress.zip | grep -q 'sakht-sar/index.php'
          unzip -t dist/sakht-sar-wordpress.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="theme-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/sakht-sar-wordpress.zip \
            --title "Sakht Sar WordPress Theme $TAG" \
            --notes "Installable WordPress theme ZIP. Upload sakht-sar-wordpress.zip directly in WordPress under Appearance > Themes > Add New > Upload Theme."
