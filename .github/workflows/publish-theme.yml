name: Publish Installable Sakht Sar Theme

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-theme]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installable theme ZIP
        run: |
          rm -rf dist
          mkdir -p dist/sakht-sar
          cp -R wp-content/themes/sakht-sar/. dist/sakht-sar/
          cd dist
          zip -r sakht-sar-wordpress.zip sakht-sar

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="theme-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/sakht-sar-wordpress.zip \
            --title "Sakht Sar WordPress Theme $TAG" \
            --notes "Installable WordPress theme ZIP. Upload this ZIP directly in WordPress under Appearance > Themes > Add New > Upload Theme."
