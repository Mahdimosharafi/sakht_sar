name: Package Sakht Sar WordPress Theme

on:
  push:
    branches: [ main, 'installable-theme-*' ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build installable theme ZIP
        run: |
          mkdir -p dist/sakht-sar
          cp -R wp-content/themes/sakht-sar/. dist/sakht-sar/
          cd dist
          zip -r sakht-sar-theme.zip sakht-sar
      - name: Upload theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sakht-sar-theme
          path: dist/sakht-sar-theme.zip
